services:
  plans:
    build: .
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # Router: plans.josechaparro.com
      #
      # Entrypoint `web` (plain HTTP), no certresolver on purpose: this host is
      # only reachable through the `jose-home` Cloudflare Tunnel, so port 80 is
      # never exposed to the internet and the ACME HTTP-01 challenge can never
      # be answered. TLS is terminated by Cloudflare at the edge. Same pattern
      # as the existing vaultwarden router.
      - traefik.http.routers.plans.rule=Host(`plans.josechaparro.com`)
      - traefik.http.routers.plans.entrypoints=web
      - traefik.http.routers.plans.middlewares=plans-headers

      # Basic security headers
      - traefik.http.middlewares.plans-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.plans-headers.headers.frameDeny=true
      - traefik.http.middlewares.plans-headers.headers.referrerPolicy=strict-origin-when-cross-origin

      - traefik.http.services.plans.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
