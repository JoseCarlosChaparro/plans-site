server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve .html without needing the extension in the URL
    # /plans/fuerza  ->  fuerza.html
    location / {
        try_files $uri $uri.html $uri/ =404;

        # `/` is served by this block, not by the \.html$ one below (location
        # matching runs on the request URI, before index resolution), so the
        # no-cache header has to be repeated here or the gallery would be the
        # one document Cloudflare is free to cache.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets, but not HTML (so plan updates show immediately).
    # `expires` emits its own Cache-Control, so setting both here would send
    # the header twice — the max-age is spelled out in add_header instead.
    location ~* \.(css|js|woff2?|png|jpe?g|svg|webp)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
