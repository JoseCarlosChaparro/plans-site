# Security headers, included in every location block: an add_header inside a
# location replaces every add_header inherited from the server block, so a
# server-level copy would silently vanish wherever a location sets its own
# Cache-Control. HSTS is sent by Cloudflare's edge.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
